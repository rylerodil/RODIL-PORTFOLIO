<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <title>Exam | Rylee Rodil</title>

</head>

<body data-category="exam">

    <div class="stars"></div>
    <div class="glow-orb orb-one"></div>
    <div class="glow-orb orb-two"></div>


    <!-- NAVIGATION -->
    <header>

        <a href="index.html" class="logo">

            <span class="logo-icon">
                &lt;/&gt;
            </span>

            <span>
                Rylee Rodil
            </span>

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="quiz.html">
                Quiz
            </a>

            <a href="laboratory.html">
                Laboratory
            </a>

            <a href="exam.html" class="active">
                Exam
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- EXAM -->
    <section class="portfolio-page">

        <div class="page-title reveal-up">

            <div class="page-icon">
                <i class="fa-solid fa-file-circle-check"></i>
            </div>

            <h1>
                My <span>Exams</span>
            </h1>

            <p>
                Store your examination activities as files.
                Images and PDF files can be previewed directly
                in the portfolio.
            </p>

        </div>


        <div class="file-toolbar reveal-up">

            <span id="fileCount" class="file-count">
                0 files saved
            </span>

            <label for="fileInput" class="upload-button">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                Add Exam File

            </label>

            <input
                id="fileInput"
                type="file"
                multiple
                hidden>

        </div>


        <div id="fileGrid" class="file-grid"></div>

    </section>


    <!-- MODAL -->
    <div id="fileModal" class="file-modal">

        <div class="modal-box">

            <div class="modal-head">

                <strong id="modalTitle">
                    File
                </strong>

                <button id="closeModal" class="close-modal">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <div id="modalContent" class="modal-content"></div>

        </div>

    </div>


    <footer>

        <p>
            © 2026 Rylee Rodil
        </p>

        <span>
            Examination Portfolio
        </span>

    </footer>


    <script src="script.js"></script>

</body>

</html>
